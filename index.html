<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover 는 아이폰 노치/홈바 영역까지 배경을 채우기 위한 것입니다.
      maximum-scale 을 넣어 확대를 막지는 않습니다 — 글씨를 키워 보는 사람이 있습니다.
      interactive-widget=resizes-content 는 안드로이드에서 키보드가 올라오면 화면 자체를
      줄여 달라는 뜻입니다. 이게 없으면 아래에 고정한 입력 칸이 키보드 뒤로 숨습니다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fdf6ec" />
    <title>우리집</title>

    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열립니다 -->
    <!-- 하위 경로에 올려도 깨지지 않도록 전부 상대 경로로 둡니다 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="우리집" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
