# main 브랜치에 푸시하면 GitHub Pages 에 자동으로 올라갑니다.
# 앞으로 앱을 고칠 때는 푸시만 하면 끝입니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로 돌릴 수도 있게 열어 둡니다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시했을 때 배포가 엉키지 않게 합니다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 빌드할 때 Supabase 주소와 키가 필요합니다.
      # GitHub 저장소 → Settings → Secrets and variables → Actions 에
      # 아래 두 개를 등록해 두세요. 없으면 배포된 사이트가
      # '서버 연결 정보가 없어요' 화면만 보여 줍니다.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
