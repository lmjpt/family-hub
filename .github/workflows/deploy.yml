# main 브랜치에 푸시하면 GitHub Pages 에 자동으로 올라갑니다.
# 앞으로 앱을 고칠 때는 푸시만 하면 끝입니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로 돌릴 수도 있게 열어 둡니다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시했을 때 배포가 엉키지 않게 합니다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
