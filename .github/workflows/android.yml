# 안드로이드 앱(APK)을 클라우드에서 만들어 GitHub Release 에 올립니다.
# android/ 폴더가 바뀌면 자동으로 돌고, Actions 탭에서 손으로도 돌릴 수 있습니다.
#
# 결과물 주소는 항상 같습니다 (가족 폰에서 이 주소로 받아 설치):
#   https://github.com/lmjpt/family-hub/releases/latest/download/family-hub.apk
#
# 서명 키는 secret 세 개에서 옵니다 (원본은 PC 의 android-signing.local 폴더):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradle wrapper(jar) 를 저장소에 넣지 않고 Actions 가 Gradle 을 직접 준비합니다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 서명 키 준비
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.p12
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: APK 빌드
        run: gradle -p android assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Release 에 올리기
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk family-hub.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest family-hub.apk \
            --title "우리집 안드로이드 앱" \
            --notes "폰에서 family-hub.apk 를 내려받아 설치하세요. 설치 후 앱 → 설정 → 위젯 연결." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
